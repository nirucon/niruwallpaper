name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
      # A static binary keeps one artifact valid on Arch, Debian and Void.
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: |
          test "$(target/x86_64-unknown-linux-musl/release/niruwallpaper --version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
          file target/x86_64-unknown-linux-musl/release/niruwallpaper
          sh tests/cli-smoke.sh target/x86_64-unknown-linux-musl/release/niruwallpaper
      - run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/niruwallpaper dist/
          cp niruwallpaper.desktop dist/
          # The icon ships here so NIRUX can serve the launcher entry and its
          # icon from one verified release.
          cp assets/niruwallpaper.png dist/niruwallpaper.png
          cd dist && sha256sum niruwallpaper niruwallpaper.desktop niruwallpaper.png > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }
  publish-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            dist/niruwallpaper
            dist/niruwallpaper.desktop
            dist/niruwallpaper.png
            dist/SHA256SUMS
          generate_release_notes: true
